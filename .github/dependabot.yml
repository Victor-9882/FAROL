# Atualizações de dependências (IC-08). Os PRs pedem revisão automaticamente
# ao dono dos arquivos no CODEOWNERS (Pietro para pyproject/uv.lock, Yuri para workflows).
# Os prefixos geram títulos em Conventional Commits, ex.: "build(deps): bump django ...".

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencias"]
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencias"]
    commit-message:
      prefix: build
      include: scope
    groups:
      menores:
        update-types: ["minor", "patch"]
