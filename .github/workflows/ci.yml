# Integração contínua do FAROL (IC-09, GConfig Seção 6).
# Roda a cada PR para a main e a cada integração na main.
# Os nomes dos jobs ("name:") são os status checks exigidos na proteção da main;
# se mudar um nome aqui, atualize o ruleset.
#
# Enquanto não houver código (pyproject.toml / manage.py), as etapas de
# migração e testes são puladas com um aviso e a CI passa.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Credenciais descartáveis, válidas só dentro do runner da CI.
  DATABASE_URL: postgres://farol:farol@localhost:5432/farol_ci
  DJANGO_SECRET_KEY: ci-chave-descartavel-nao-e-segredo
  DJANGO_DEBUG: "False"

jobs:
  estilo:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Lint
        run: uvx ruff check .
      - name: Formatação
        run: uvx ruff format --check .

  migracoes:
    name: Migrações em banco vazio
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: farol
          POSTGRES_DB: farol_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Projeto Django ainda não existe
        if: hashFiles('manage.py') == ''
        run: echo "::notice::manage.py não encontrado; verificação de migrações ignorada."
      - uses: astral-sh/setup-uv@v7
        if: hashFiles('manage.py') != ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências
        if: hashFiles('manage.py') != ''
        run: uv sync --locked
      - name: Há mudança no modelo sem migração?
        if: hashFiles('manage.py') != ''
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Aplicar migrações no banco vazio
        if: hashFiles('manage.py') != ''
        run: uv run python manage.py migrate --noinput

  testes:
    name: Testes
    runs-on: ubuntu-latest
    needs: [estilo]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: farol
          POSTGRES_DB: farol_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Projeto ainda não existe
        if: hashFiles('pyproject.toml') == ''
        run: echo "::notice::pyproject.toml não encontrado; testes ignorados."
      - uses: astral-sh/setup-uv@v7
        if: hashFiles('pyproject.toml') != ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --locked
      # Regras de negócio dos alertas primeiro (RN001, RN002, RN005, RN008, RN009).
      # TODO: marcar esses testes com @pytest.mark.regras no código.
      - name: Testes das regras de negócio
        if: hashFiles('pyproject.toml') != ''
        run: |
          set +e
          uv run pytest -m regras --no-cov
          codigo=$?
          if [ "$codigo" -eq 5 ]; then
            echo "::warning::Nenhum teste marcado como 'regras' ainda."
            exit 0
          fi
          exit "$codigo"
      - name: Suíte completa com cobertura
        if: hashFiles('pyproject.toml') != ''
        # TODO: definir fail_under em [tool.coverage.report] no pyproject.toml
        # (Plano de Testes: ≥ 80% das linhas no módulo de Ingestão).
        run: uv run pytest --cov --cov-report=term-missing
