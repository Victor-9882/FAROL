# Integração contínua do FAROL (IC-09, GConfig Seção 6).
# Roda a cada PR para a main e a cada integração na main.
# Os nomes dos jobs ("name:") são os status checks exigidos na proteção da main;
# se mudar um nome aqui, atualize o ruleset.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Credenciais descartáveis, válidas só dentro do runner da CI.
  DATABASE_URL: postgres://farol:farol@localhost:5432/farol_ci
  DJANGO_SECRET_KEY: ci-chave-descartavel-nao-e-segredo
  DJANGO_DEBUG: "False"

jobs:
  estilo:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Lint
        run: uvx ruff check .
      - name: Formatação
        run: uvx ruff format --check .

  migracoes:
    name: Migrações em banco vazio
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: farol
          POSTGRES_DB: farol_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências
        run: uv sync --locked
      - name: Há mudança no modelo sem migração?
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Aplicar migrações no banco vazio
        run: uv run python manage.py migrate --noinput

  testes:
    name: Testes
    runs-on: ubuntu-latest
    needs: [estilo]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farol
          POSTGRES_PASSWORD: farol
          POSTGRES_DB: farol_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U farol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependências
        run: uv sync --locked
      # Regras de negócio dos alertas primeiro (RN001, RN002, RN005, RN008, RN009).
      - name: Testes das regras de negócio
        run: |
          set +e
          uv run pytest -m regras --no-cov
          codigo=$?
          if [ "$codigo" -eq 5 ]; then
            echo "::warning::Nenhum teste marcado como 'regras' ainda."
            exit 0
          fi
          exit "$codigo"
      - name: Suíte completa com cobertura
        # Meta de cobertura em [tool.coverage.report] fail_under, no pyproject.toml.
        run: uv run pytest --cov --cov-report=term-missing

  # Sobe o docker-compose.yml como um integrante faria e confere os três serviços (IC-08).
  docker:
    name: Ambiente Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Criar .env a partir do exemplo
        run: cp .env.example .env
      - name: Subir aplicação, banco e Mailpit
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Aplicação responde e alcança o banco
        run: curl --fail --silent --show-error http://localhost:8000/saude/
      - name: E-mail chega ao Mailpit
        run: |
          docker compose exec -T app python manage.py sendtestemail teste@exemplo.org
          curl --fail --silent http://localhost:8025/api/v1/messages | grep -q 'teste@exemplo.org'
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derrubar o ambiente
        if: always()
        run: docker compose down --volumes
