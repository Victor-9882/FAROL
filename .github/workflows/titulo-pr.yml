# Verifica se o título do PR segue Conventional Commits.
# Como a main usa squash merge, o título vira a mensagem do commit.
# Arquivo separado do ci.yml para rodar também quando o título é editado.

name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions: {}

jobs:
  titulo:
    name: Título em Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Verificar título
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          padrao='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+'
          if [[ "$TITULO" =~ $padrao ]]; then
            echo "Título OK: $TITULO"
          else
            echo "::error::Título fora do padrão: '$TITULO'"
            echo "Use: tipo(escopo): descrição (REQUISITO)"
            echo "Ex.: feat(ingestao): importa frequência da catraca (RF003)"
            exit 1
          fi
