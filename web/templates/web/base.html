<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}FAROL{% endblock %}</title>
</head>
<body>
  <header>
    <strong>FAROL</strong>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'web:logout' %}" style="display:inline">
        {% csrf_token %}
        <span>{{ user.get_full_name|default:user.username }} · {{ user.get_perfil_display }}</span>
        <button type="submit">Sair</button>
      </form>
    {% endif %}
  </header>
  <main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
