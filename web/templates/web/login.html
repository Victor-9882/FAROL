{% extends "web/base.html" %}
{% block titulo %}Entrar · FAROL{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {% if form.errors %}<p role="alert">Usuário ou senha inválidos.</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
