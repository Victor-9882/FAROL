# Ambiente de desenvolvimento do FAROL (IC-08, NF017).
# Antes de subir: cp .env.example .env
#
#   docker compose up --build     aplicação em http://localhost:8000/saude/
#                                 Mailpit (e-mails de teste) em http://localhost:8025
#
# Só dados sintéticos neste ambiente.

services:
  app:
    build: .
    env_file:
      - path: .env
        required: true
    environment:
      # Dentro da rede do Compose, banco e e-mail são acessados pelo nome do serviço.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EMAIL_URL: smtp://mailpit:1025
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/saude/')
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Exposto também para rodar `uv run ...` direto na máquina.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    # Servidor SMTP de teste: captura os e-mails sem entregá-los (RF017).
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # interface web

volumes:
  pgdata:
